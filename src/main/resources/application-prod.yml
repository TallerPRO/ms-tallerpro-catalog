# Perfil de PRODUCCION de ms-tallerpro-catalog (SPRING_PROFILES_ACTIVE=prod).
# Se superpone a application.yml. Reglas:
#  - Los secretos NO tienen valor por defecto: si falta la variable, el arranque falla.
#  - La validacion JWT queda fija en true (no depende de TALLERPRO_JWT_ENABLED).
#  - Swagger/OpenAPI apagado y Actuator reducido a /actuator/health sin detalles.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # RIESGO CONOCIDO: catalog no tiene migraciones (Flyway/Liquibase); con BD vacia
      # "validate" no puede crear el esquema. Se deja "update" de forma EXPLICITA (solo agrega
      # tablas/columnas, no versiona ni migra datos). Pendiente: Flyway + "validate".
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audiences: ${AZURE_API_CLIENT_ID},api://${AZURE_API_CLIENT_ID}  # token v2: aud = client id pelado

tallerpro:
  security:
    # Fijo: en produccion siempre se valida el JWT de Azure AD.
    jwt-enabled: true
    # Sin roles ficticios: el usuario de desarrollo nunca debe existir en produccion.
    dev-roles: ""

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
