spring:
  application:
    name: ms-tallerpro-catalog
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tallerpro_catalog}
    username: ${DB_USER:tallerpro}
    password: ${DB_PASSWORD:tallerpro}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:tenant-id}/v2.0
          audiences: api://${AZURE_API_CLIENT_ID:api-client-id}

server:
  port: ${SERVER_PORT:8082}

tallerpro:
  security:
    # false -> desarrollo local sin tenant (no exige JWT). Debe ser true en la nube.
    jwt-enabled: ${TALLERPRO_JWT_ENABLED:true}
    # Roles del usuario ficticio cuando jwt-enabled=false (solo desarrollo).
    dev-roles: ${TALLERPRO_DEV_ROLES:Admin,JefeTaller}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ms_tallerpro.catalog: INFO
