# Docker Compose para desarrollo local de ms-tallerpro-catalog con su propia base
# PostgreSQL (database-per-service, ver DAS 5.3), siguiendo el mismo patron que
# ms-tallerpro-jobs/docker-compose.yml.
services:
  ms-tallerpro-catalog:
    build: .
    image: tallerpro/ms-tallerpro-catalog:latest
    container_name: ms-tallerpro-catalog
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: db-catalog
      DB_PORT: 5432
      DB_NAME: tallerpro_catalog
      DB_USER: tallerpro
      DB_PASSWORD: tallerpro
      TALLERPRO_JWT_ENABLED: ${TALLERPRO_JWT_ENABLED:-true}
      TALLERPRO_DEV_ROLES: ${TALLERPRO_DEV_ROLES:-Admin,JefeTaller}
    depends_on:
      db-catalog:
        condition: service_healthy
    networks:
      - tallerpro-apps

  db-catalog:
    image: postgres:16-alpine
    container_name: db-catalog
    restart: unless-stopped
    environment:
      POSTGRES_DB: tallerpro_catalog
      POSTGRES_USER: tallerpro
      POSTGRES_PASSWORD: tallerpro
    volumes:
      - db-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallerpro -d tallerpro_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tallerpro-apps

networks:
  tallerpro-apps:
    driver: bridge

volumes:
  db-catalog-data:
